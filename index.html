<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connessione Hotspot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .input-group {
            display: none;
            margin-top: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Benvenuto nella Rete</h1>
    <p>Accedi a internet inserendo direttamente l'indirizzo web che desideri visitare.</p>
    
    <!-- Pulsante Iniziale -->
    <button id="startBtn" onclick="mostraCampo()">Naviga nel Web</button>

    <!-- Gruppo Input (Nascosto all'inizio) -->
    <div id="inputGroup" class="input-group">
        <input type="text" id="urlInput" placeholder="es. wikipedia.org o www.ansa.it" autofocus>
        <button onclick="vaiAlSito()">Vai al sito</button>
    </div>
</div>

<script>
    function mostraCampo() {
        // Nasconde il primo pulsante e mostra il campo di testo
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('inputGroup').style.display = 'block';
    }

    function vaiAlSito() {
        let url = document.getElementById('urlInput').value.trim();
        
        if (url === "") {
            alert("Per favore, inserisci un indirizzo web.");
            return;
        }

        // Controllo e correzione del protocollo (HTTP/HTTPS)
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }

        // Reindirizza la scheda attuale all'URL inserito
        window.location.href = url;
    }

    // Permette di premere "Invio" sulla tastiera per confermare l'URL
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            vaiAlSito();
        }
    });
</script>

</body>
</html>
